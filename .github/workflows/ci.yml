name: Testes de Automação Cypress

# Quando disparar este pipeline:
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

jobs:
  # ===========================================================================
  # Job 1: Testes sem BDD (Page Object Model)
  # ===========================================================================
  testes-sem-bdd:
    name: Testes sem BDD (POM)
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes sem BDD
        run: npm run test:sem-bdd
        env:
          # Variável de ambiente para aumentar o timeout no CI
          CYPRESS_defaultCommandTimeout: 10000

      - name: Fazer upload das capturas de tela em caso de falha
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screenshots-sem-bdd
          path: cypress/screenshots/
          retention-days: 7

  # ===========================================================================
  # Job 2: Testes BDD (Gherkin/Cucumber)
  # ===========================================================================
  testes-bdd:
    name: Testes BDD (Gherkin)
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes BDD
        run: npm run test:bdd
        env:
          CYPRESS_defaultCommandTimeout: 10000

      - name: Fazer upload das capturas de tela em caso de falha
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screenshots-bdd
          path: cypress/screenshots/
          retention-days: 7
