version: '3.8'

networks:
  pipeline-net:
    driver: bridge
    name: pipeline-net

volumes:
  jenkins-data:
    name: s07-jenkins-data
  relatorios-data:
    name: s07-relatorios-data

services:

  jenkins:
    build:
      context: ..
      dockerfile: pipeline_docker/Dockerfile.jenkins
    container_name: jenkins
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins-data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - relatorios-data:/relatorios
      - ..:/workspace:ro
    networks:
      - pipeline-net
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/login"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  cypress-runner:
    build:
      context: ..
      dockerfile: pipeline_docker/Dockerfile.cypress
    container_name: cypress-runner
    restart: unless-stopped
    volumes:
      - relatorios-data:/relatorios
      - relatorios-data:/app/cypress/screenshots
    networks:
      - pipeline-net
    environment:
      - DISPLAY=:99
    depends_on:
      jenkins:
        condition: service_healthy

  newman-runner:
    build:
      context: ..
      dockerfile: pipeline_docker/Dockerfile.newman
    container_name: newman-runner
    restart: unless-stopped
    volumes:
      - relatorios-data:/relatorios
    networks:
      - pipeline-net
    depends_on:
      jenkins:
        condition: service_healthy

  relatorio-server:
    image: nginx:alpine
    container_name: relatorio-server
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - relatorios-data:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - pipeline-net
    depends_on:
      - cypress-runner
      - newman-runner
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 3
