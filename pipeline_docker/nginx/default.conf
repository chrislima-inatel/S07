server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;

    autoindex on;
    autoindex_exact_size off;
    autoindex_localtime on;

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location /api-report.html {
        try_files $uri =404;
        add_header Content-Type "text/html; charset=utf-8";
    }

    location /screenshots/ {
        autoindex on;
        add_header Cache-Control "no-cache";
    }

    error_page 404 /404.html;
    location = /404.html {
        return 404 '<!DOCTYPE html>
<html>
<head><title>Relatório não encontrado</title></head>
<body>
  <h2>Relatório ainda não gerado</h2>
  <p>Execute o pipeline Jenkins primeiro para gerar os relatórios.</p>
  <p><a href="/">Voltar para lista de relatórios</a></p>
  <p><a href="http://localhost:8080">Abrir Jenkins</a></p>
</body>
</html>';
        add_header Content-Type "text/html; charset=utf-8";
    }

    access_log /var/log/nginx/relatorios_access.log;
    error_log  /var/log/nginx/relatorios_error.log;
}
